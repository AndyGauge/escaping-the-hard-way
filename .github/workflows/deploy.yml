name: Deploy mdbook to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build English
        run: cd book && mdbook build

      - name: Build Spanish
        run: cd book-es && mdbook build

      - name: Build Tagalog
        run: cd book-tl && mdbook build

      - name: Combine builds
        run: |
          mkdir -p _site/book
          cp index.html _site/
          cp LICENSE.md _site/
          cp -r book/book/* _site/book/
          mkdir -p _site/es
          cp -r book-es/book/* _site/es/
          mkdir -p _site/tl
          cp -r book-tl/book/* _site/tl/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
