on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build English
        run: cd book && mdbook build

      - name: Build Spanish
        run: cd book-es && mdbook build

      - name: Build Tagalog
        run: cd book-tl && mdbook build

      - name: Combine builds
        run: |
          mkdir -p _site/book
          cp index.html _site/
